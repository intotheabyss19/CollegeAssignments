server {
    listen 80 default_server;
    server_name www.corp.lab;
    root /srv/www;
    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / { try_files $uri $uri/ =404; }

    # "staff portal" behind HTTP Basic auth: the password crosses the wire base64-encoded, not encrypted
    location /admin/ {
        auth_basic "Corp staff portal";
        auth_basic_user_file /srv/www/.htpasswd;
    }

    # fake search API so injection attempts get a 200 instead of a 404
    location /search { default_type text/plain; return 200 "no results\n"; }
}
