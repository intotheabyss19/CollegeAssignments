# Receives logs from Docker's fluentd logging driver, parses the app's JSON, ships to
# Elasticsearch (daily indices docker-logs-YYYY.MM.DD) and keeps a local file archive.

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# the driver wraps each line as {"log": "...", "container_name": ..., "source": "stdout"}
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key ts
    keep_time_key true
    time_format %Y-%m-%dT%H:%M:%S%z
  </parse>
</filter>

<filter docker.**>
  @type record_transformer
  <record>
    collector "#{Socket.gethostname}"
    docker_tag ${tag}
  </record>
</filter>

<match docker.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix docker-logs
    include_tag_key true
    verify_es_version_at_startup false
    default_elasticsearch_version 8
    suppress_type_name true
    <buffer>
      flush_interval 5s
      retry_forever true
    </buffer>
  </store>
  <store>
    @type file
    # one archive file per container per hour
    path /fluentd/log/archive/${tag}/%Y%m%d-%H
    <buffer tag,time>
      @type file
      path /fluentd/log/buffer/archive   # staging area, outside the bind-mounted archive
      timekey 1h
      timekey_wait 1m
    </buffer>
  </store>
</match>
