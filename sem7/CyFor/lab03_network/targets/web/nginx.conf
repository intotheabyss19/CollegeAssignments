server {
    listen 80;
    server_name web.lab;
    root /usr/share/nginx/html;
    server_tokens on;                       # leaks the version - nmap -sV / http-headers will show it
    autoindex on;                           # directory listing on /files/ - http-enum finds it

    location / { index index.html; }

    location /admin/ {                      # HTTP Basic auth over plain HTTP = cleartext creds
        auth_basic "CyFor Lab Admin";
        auth_basic_user_file /etc/nginx/htpasswd;
    }

    location = /login {                     # accepts a form POST so credentials cross the wire
        if ($request_method = POST) { return 302 /admin/; }
        return 405;
    }
}
